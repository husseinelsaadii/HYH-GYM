{% extends "base.html" %}

{% block head %}
    <title>HYH Training | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<main class="login-container">
    <div class="form-container">

        <h2>JOIN THE FAMILY</h2>

        <!-- Display error messages -->
        {% if error %}
            <div class="alert alert-danger" style="background-color: #dc3545; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                {{ error }}
            </div>
        {% endif %}

        <!-- Flask-Login register form -->
        <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="6">
                <small style="color: #ccc; font-size: 0.8rem;">Minimum 6 characters</small>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
            </div>

            <button type="submit" class="primary-btn">Register</button>
        </form>

        <!-- Link to login page -->
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #ccc; font-size: 0.9rem;">
                Already have an account? 
                <a href="{{ url_for('login') }}" style="color: #FFDD00; text-decoration: none;">Sign In</a>
            </p>
        </div>

    </div>
</main>

<script>
function validateForm() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return false;
    }
    return true;
}
</script>
{% endblock %}
